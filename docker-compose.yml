services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: moonrathi/portfolio-web:latest
    container_name: moon_portfolio_web
    restart: unless-stopped
    ports:
      - "8080:4173"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting Compose}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET before starting Compose}
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./certs:/app/certs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4173/api/site"]
      interval: 30s
      timeout: 3s
      retries: 3
