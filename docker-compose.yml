services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: moonrathi/portfolio-web:latest
    container_name: moon_portfolio_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
