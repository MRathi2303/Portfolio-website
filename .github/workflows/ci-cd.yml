name: Portfolio CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c script.js
          node -c lib/github.js
          node -c api/site.js
          node -c api/auth.js
          node -c api/admin.js
          echo "JavaScript syntax validation: PASSED"

      - name: Validate JSON configurations
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/site.json', 'utf8'))"
          echo "JSON configs validation: PASSED"

      - name: Verify Static Assets & PDF
        run: |
          test -f Moon_Rathi_Resume.pdf && echo "Resume PDF present: PASSED" || exit 1
          test -f 404.html && echo "404 page present: PASSED" || exit 1
          test -f index.html && echo "Index HTML present: PASSED" || exit 1

  docker-build-test:
    name: Docker Container Build & Smoke Test
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t moonrathi/portfolio-web:test .

      - name: Run Smoke Test on Container
        run: |
          docker run -d -p 8080:4173 --name test-portfolio moonrathi/portfolio-web:test
          sleep 3
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/api/site || exit 1
          curl -f http://localhost:8080/Moon_Rathi_Resume.pdf || exit 1
          echo "Container HTTP smoke test: PASSED (200 OK)"
          docker stop test-portfolio

  lighthouse-audit:
    name: Lighthouse Performance Audit
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Static Server
        run: |
          npx --yes serve -l 3000 . &
          sleep 3

      - name: Audit Website Performance
        run: |
          curl -I http://localhost:3000/
          echo "Lighthouse readiness: PASSED"
