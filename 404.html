<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404: Not Found — moon@blaze.portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111318'/><text x='12' y='66' font-size='52' fill='%234ade80' font-family='monospace'>&gt;_</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0e12;
      color: #d1d5db;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .err-card {
      width: min(640px, 94vw);
      background: #111318;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .err-card__bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #181b22;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .err-card__btns { display: flex; gap: 6px; }
    .b { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .b.close { background: #ff5f57; }
    .b.min { background: #febc2e; }
    .b.max { background: #28c840; }
    .err-card__title { font-size: 0.8rem; color: #888; margin-left: 8px; }
    .err-card__body { padding: 24px 28px; line-height: 1.7; font-size: 0.88rem; }
    .err-prompt { color: #4ade80; }
    .err-code { color: #ef4444; font-weight: 700; margin: 12px 0 6px; font-size: 1.2rem; }
    .err-msg { color: #9ca3af; margin-bottom: 20px; }
    .err-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 6px;
      color: #4ade80;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .err-action:hover {
      background: rgba(74, 222, 128, 0.22);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="err-card">
    <div class="err-card__bar">
      <div class="err-card__btns">
        <span class="b close"></span><span class="b min"></span><span class="b max"></span>
      </div>
      <div class="err-card__title">bash: 404 — resource not found</div>
    </div>
    <div class="err-card__body">
      <div><span class="err-prompt">moon@blaze.portfolio:~$</span> curl -I https://moon.rathi/requested_route</div>
      <div class="err-code">HTTP/2 404 Not Found</div>
      <p class="err-msg">
        The requested endpoint or path does not exist in this virtual filesystem.<br>
        Process exited with status code 127 (ENOENT).
      </p>
      <a href="/" class="err-action">cd ~/portfolio (Return Home) ↗</a>
    </div>
  </div>
</body>
</html>
